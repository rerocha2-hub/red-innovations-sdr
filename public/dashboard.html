<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Painel — PipeSolo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container" style="padding-top:18px; padding-bottom:60px;">
    <div class="nav">
      <a class="brand" href="/">Pipe<span>Solo</span></a>
      <div>
        <button id="new-deal" class="btn sm">+ Novo negócio</button>
        <button id="logout" class="btn ghost sm">Sair</button>
      </div>
    </div>

    <div id="banner"></div>

    <div class="dash-head">
      <div>
        <h2 id="rep-name" style="margin:0;">…</h2>
        <p class="muted" id="plan-line" style="margin:4px 0 0;"></p>
      </div>
    </div>

    <div class="stats" style="grid-template-columns: repeat(4, 1fr);">
      <div class="stat"><div class="n" id="stat-follow">0</div><div class="l">Follow-ups para hoje</div></div>
      <div class="stat"><div class="n" id="stat-open">0</div><div class="l">Negócios em aberto</div></div>
      <div class="stat"><div class="n" id="stat-value">R$ 0</div><div class="l">Valor no pipeline</div></div>
      <div class="stat"><div class="n" id="stat-won">R$ 0</div><div class="l">Ganho neste mês</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="today">🎯 Hoje</button>
      <button class="tab" data-tab="pipeline">📊 Pipeline</button>
      <button class="tab" data-tab="contacts">👥 Contatos</button>
      <button class="tab" data-tab="plan">Assinatura</button>
    </div>

    <!-- Hoje: follow-up queue -->
    <section class="panel active" id="panel-today">
      <p class="muted">Quem você precisa perseguir agora — em ordem de urgência.</p>
      <div id="today-empty" class="card center muted hidden">
        🎉 Tudo em dia! Nenhum follow-up pendente. Bom trabalho.
      </div>
      <div id="today-list"></div>
    </section>

    <!-- Pipeline: kanban -->
    <section class="panel" id="panel-pipeline">
      <div id="board" class="board"></div>
    </section>

    <!-- Contatos -->
    <section class="panel" id="panel-contacts">
      <div class="card" style="margin-bottom:18px;">
        <strong>Adicionar contato</strong>
        <form id="contact-form" class="mt">
          <div class="field-row">
            <div><label>Nome</label><input id="c-name" required /></div>
            <div><label>Empresa</label><input id="c-company" /></div>
          </div>
          <div class="field-row">
            <div><label>E-mail</label><input id="c-email" type="email" /></div>
            <div><label>Telefone</label><input id="c-phone" /></div>
          </div>
          <button class="btn mt" type="submit">Adicionar contato</button>
        </form>
      </div>
      <table>
        <thead><tr><th>Nome</th><th>Empresa</th><th>Contato</th><th>Negócios abertos</th><th></th></tr></thead>
        <tbody id="contacts-body"></tbody>
      </table>
    </section>

    <!-- Assinatura -->
    <section class="panel" id="panel-plan">
      <div class="card">
        <h3 style="margin-top:0;">Sua assinatura</h3>
        <p id="plan-detail" class="muted"></p>
        <div id="plan-actions"></div>
        <p class="muted" style="font-size:.8rem; margin-top:18px;" id="stripe-note"></p>
      </div>
    </section>
  </div>

  <!-- Modal -->
  <div id="modal-backdrop" class="modal-backdrop hidden">
    <div class="modal card">
      <div class="modal-head">
        <h3 id="modal-title">…</h3>
        <button id="modal-close" class="btn ghost sm">✕</button>
      </div>
      <div id="modal-body"></div>
    </div>
  </div>

  <script type="module" src="/js/dashboard.js"></script>
</body>
</html>
