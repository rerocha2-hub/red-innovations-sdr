<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Entrar — PipeSolo</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="container narrow" style="padding-top:48px;">
    <div class="nav">
      <a class="brand" href="/">Pipe<span>Solo</span></a>
    </div>
    <div class="card">
      <h2 style="margin-top:0;">Entrar</h2>
      <div id="alert" class="hidden"></div>
      <form id="form">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" required />
        <label for="password">Senha</label>
        <input id="password" name="password" type="password" required />
        <button class="btn" type="submit" style="width:100%; margin-top:18px;">Entrar</button>
      </form>
      <p class="muted mt center">Não tem conta? <a href="/signup.html">Criar grátis</a></p>
    </div>
  </div>

  <script type="module">
    import { api, showAlert } from '/js/api.js';
    const form = document.getElementById('form');
    const alertEl = document.getElementById('alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = form.querySelector('button');
      btn.disabled = true;
      try {
        await api('/api/auth/login', {
          method: 'POST',
          body: { email: form.email.value, password: form.password.value },
        });
        window.location.href = '/dashboard';
      } catch (err) {
        showAlert(alertEl, err.message);
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
